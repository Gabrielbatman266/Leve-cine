name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk LeveCine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LeveCine-apk
          path: LeveCine.apk
